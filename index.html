<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Booth de Cumpleaños</title>
    <!-- Conectamos la aplicación -->
    <link rel="manifest" href="manifest.json">
    
    <link href="https://fonts.googleapis.com/css2?family=Isometra&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="flash"></div>

    <div class="header">
        <h1>Photo Booth</h1>
        <p id="status-text">¡Personaliza tu sesión y presiona comenzar!</p>
    </div>

    <div class="main-container">
        
        <div class="panel-container controls-container">
            <h3>Configuración</h3>
            <label for="timer-select">Segundos:</label>
            <select id="timer-select">
                <option value="3">3 Segundos</option>
                <option value="5">5 Segundos</option>
                <option value="10">10 Segundos</option>
            </select>

            <label for="grid-select">Cantidad de Fotos:</label>
            <select id="grid-select">
                <option value="3">3 Fotos (Clásico)</option>
                <option value="1">1 Foto Única</option>
                <option value="4">4 Fotos (Grid 2x2)</option>
                <option value="6">6 Fotos (Grid 2x3)</option>
            </select>

            <label for="filter-select">Filtro:</label>
            <select id="filter-select">
                <option value="none">Normal</option>
                <option value="grayscale(100%)">Blanco y Negro</option>
                <option value="sepia(80%)">Sepia Vintage</option>
                <option value="invert(100%)">Invertido</option>
                <option value="hue-rotate(90deg)">Psicodélico</option>
            </select>
        </div>

        <div class="camera-wrapper">
            <div class="camera-container">
                <video id="video" autoplay playsinline></video>
                <div id="countdown" class="hidden">3</div>
            </div>
            <button id="start-btn" class="btn-primary">Comenzar Captura</button>
        </div>

        <div class="panel-container strip-container">
            <div id="photo-strip" class="grid-layout-3"></div>
            
            <div id="action-buttons" class="hidden">
                <button id="download-btn" class="btn-success">Descargar Tira</button>
                <button id="retake-btn" class="btn-secondary">Limpiar Sesión</button>
            </div>
        </div>

    </div>

    <canvas id="canvas" class="hidden"></canvas>
    
    <!-- Script para instalar la app -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
    <script src="app.js"></script>
</body>
</html>
